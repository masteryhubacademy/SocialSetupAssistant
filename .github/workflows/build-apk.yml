
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/masteryhub/socialsetup
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SocialSetupAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.masteryhub.socialsetup'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.masteryhub.socialsetup'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Social Setup Assistant"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/masteryhub/socialsetup/MainActivity.java <<'EOF'
          package com.masteryhub.socialsetup;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta charset="utf-8">
          <title>Social Setup Assistant</title>
          <style>
          body{font-family:Arial;background:#101827;color:white;padding:20px}
          h2{color:#68e0d0}button,input{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:8px;border:0}
          button{background:#68e0d0;font-weight:bold}input{background:#263449;color:white}
          .card{background:#1c293c;padding:16px;border-radius:12px;margin:12px 0}
          </style>
          </head>
          <body>
          <h2>Social Setup Assistant</h2>
          <p>Manage your account setup checklist.</p>
          <div class="card">
          <button onclick="openSite('https://www.instagram.com/accounts/emailsignup/')">Open Instagram Signup</button>
          <button onclick="openSite('https://www.facebook.com/reg/')">Open Facebook Signup</button>
          </div>
          <div class="card">
          <h3>Setup Record</h3>
          <input id="platform" placeholder="Platform (Instagram/Facebook)">
          <input id="label" placeholder="Account label (no password)">
          <button onclick="save()">Save Record</button>
          <button onclick="downloadCSV()">Export Records CSV</button>
          </div>
          <div id="records"></div>
          <script>
          function openSite(url){window.open(url,'_blank')}
          function get(){try{return JSON.parse(localStorage.getItem('records')||'[]')}catch(e){return []}}
          function save(){
            let p=document.getElementById('platform').value.trim();
            let l=document.getElementById('label').value.trim();
            if(!p||!l){alert('Enter platform and account label');return}
            let a=get();a.push({platform:p,label:l,date:new Date().toLocaleDateString()});
            localStorage.setItem('records',JSON.stringify(a));
            document.getElementById('platform').value='';
            document.getElementById('label').value='';show()
          }
          function show(){document.getElementById('records').innerHTML=get().map(x=>'<div class="card">'+esc(x.platform)+' — '+esc(x.label)+'<br>'+esc(x.date)+'</div>').join('')}
          function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
          function downloadCSV(){
            let rows=[['Platform','Label','Date'],...get().map(x=>[x.platform,x.label,x.date])];
            let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
            let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='setup-records.csv';a.click();URL.revokeObjectURL(a.href)
          }
          show();
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SocialSetupAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
